# 집 비서가 멈추면 HA가 알려 주는 자동화 (HA에 직접 추가해야 합니다)
#
# 권장 방식(경량): ha/status-sensors.yaml을 먼저 HA에 추가한 뒤,
# binary_sensor.jib_biseo_yeongyeol(집 비서 연결)이 off로 7분(auto_off 3분 + 7분 = 10분) 지속될 때만 알립니다.
# 기존 event 기반(mode: restart)은 60초마다 자동화 실행 기록이 남지만, 이 방식은 실제 단절 시에만 실행됩니다.
# 신호가 돌아오면 집 비서가 같은 tag(haagent-heartbeat)로 '다시 연결됐어요'를 보내 이 경고를 바꿔 놓습니다
# (config.json의 heartbeat.alert_minutes=10과 맞춤).
#
# 추가 방법: 설정 → 자동화 및 장면 → 자동화 만들기 → 오른쪽 위 ⋮ → YAML로 편집 → 아래 내용 붙여넣기
alias: 집 비서 - 응답 없음 경고
description: 집 비서(ha-agent)의 heartbeat가 10분 넘게 끊기면 알림
mode: single
triggers:
  - trigger: state
    entity_id: binary_sensor.jib_biseo_yeongyeol
    to: "off"
    for: "00:07:00"
actions:
  - action: notify.mobile_app_ibeomhun
    data:
      title: "🤖 집 비서가 응답하지 않아요"
      message: "10분 넘게 신호가 없어요. 서버의 ha-agent 서비스와 Tailscale 연결을 확인해 주세요."
      data:
        tag: haagent-heartbeat
        channel: 집 비서
        importance: default

# (대안) ha/status-sensors.yaml 없이 이벤트만 쓸 때의 기존 방식:
