# 집 비서가 멈추면 HA가 알려 주는 자동화 (HA에 직접 추가해야 합니다)
#
# 집 비서는 60초마다 haagent_heartbeat 이벤트를 보냅니다. 이 자동화는 신호가 올 때마다 다시 시작하고,
# 10분 동안 신호가 없으면 끝까지 진행해 휴대폰으로 알립니다. 서버가 꺼졌거나, 프로그램이 죽었거나,
# 서버와 HA 사이 연결(Tailscale)이 끊긴 경우를 모두 잡습니다.
# 신호가 돌아오면 집 비서가 같은 tag(haagent-heartbeat)로 '다시 연결됐어요'를 보내 이 경고를 바꿔 놓습니다
# (delay를 바꾸면 config.json의 heartbeat.alert_minutes도 같이 바꿉니다).
#
# 추가 방법: 설정 → 자동화 및 장면 → 자동화 만들기 → 오른쪽 위 ⋮ → YAML로 편집 → 아래 내용 붙여넣기
alias: 집 비서 - 응답 없음 경고
description: 집 비서(ha-agent)의 heartbeat가 10분 넘게 끊기면 알림
mode: restart
triggers:
  - trigger: event
    event_type: haagent_heartbeat
  - trigger: homeassistant
    event: start
actions:
  - delay: "00:10:00"
  - action: notify.mobile_app_ibeomhun
    data:
      title: "🤖 집 비서가 응답하지 않아요"
      message: "10분 넘게 신호가 없어요. 서버의 ha-agent 서비스와 Tailscale 연결을 확인해 주세요."
      data:
        tag: haagent-heartbeat
        channel: 집 비서
        importance: default
